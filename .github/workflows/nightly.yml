name: Build and Release Nightly APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK (Release & Debug)
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/compass-nightly.apk
          echo "tag_name=nightly" >> $GITHUB_OUTPUT
          echo "release_name=Nightly Build $(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: compass-nightly-apk
          path: release_output/compass-nightly.apk

      - name: Create or Update Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          body: |
            Автоматическая сборка приложения Compass (WebView).
            Коммит: ${{ github.sha }}
            Дата: ${{ steps.prepare_artifacts.outputs.release_name }}
          prerelease: true
          files: release_output/compass-nightly.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
